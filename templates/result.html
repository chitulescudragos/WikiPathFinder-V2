<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rezultat - WikiPathFinder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar-custom { background-color: #212529; }
        .navbar-brand { color: #00ff66 !important; font-weight: 800; letter-spacing: 1px; }
        .nav-link { color: #fff !important; font-weight: 500; }

        .iframe-container {
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            overflow: hidden;
            border: 1px solid #e9ecef;
        }

        .path-box {
            background-color: #fff;
            border-radius: 10px;
            border: 1px solid #e9ecef;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-custom py-3 mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">WikiPathFinder</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item me-3"><a class="nav-link" href="/">Acasă</a></li>
                    <li class="nav-item"><a class="nav-link" href="/history">Istoric Căutări</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4 pb-5">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-center mb-3">
            <h3 class="fw-bold text-dark mb-3 mb-md-0">Piramidă Generată</h3>
            <span class="badge bg-dark fs-6">{{ path|length }} pași</span>
        </div>

        <div class="path-box p-3 mb-4 text-center">
            <span class="text-muted fw-bold me-2">Traseu:</span>

            {% for node in path %}
                <span class="badge bg-dark fs-6 mx-1 my-1 px-3 py-2">{{ node }}</span>
                {% if not loop.last %}
                    <span style="color: #00ff66; font-weight: 900; font-size: 1.2rem;" class="mx-1">➔</span>
                {% endif %}
            {% endfor %}
        </div>

        <div class="iframe-container w-100">
            <iframe src="/graph" width="100%" height="800px" style="border: none;"></iframe>
        </div>
    </div>

</body>
</html>
